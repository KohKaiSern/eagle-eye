services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eagle_eye
      POSTGRES_USER: eagle_eye
      POSTGRES_PASSWORD: eagle_eye
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eagle_eye -d eagle_eye"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - eagle_eye_postgres_data:/var/lib/postgresql/data

volumes:
  eagle_eye_postgres_data:
